<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07110b">
  <title>چوونەژوورەوە - VERO FARM</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700;800;900&display=swap');
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;
      font-family:'Noto Sans Arabic',Tahoma,Arial,sans-serif;color:#f5fff8;
      background:
        radial-gradient(circle at 15% 0%,rgba(72,240,139,.15),transparent 35%),
        radial-gradient(circle at 100% 25%,rgba(255,209,102,.09),transparent 30%),
        linear-gradient(180deg,#07110b,#030605);
    }
    .card{
      width:min(100%,440px);padding:24px;border-radius:26px;
      background:linear-gradient(145deg,rgba(17,35,24,.86),rgba(6,18,11,.8));
      border:1px solid rgba(135,255,177,.16);
      box-shadow:0 18px 60px rgba(0,0,0,.45);
      backdrop-filter:blur(14px);
    }
    .brand{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:20px}
    .logo{width:58px;height:58px;display:grid;place-items:center;font-size:34px;border-radius:20px;background:#102719}
    h1{font-size:22px;margin:0}.sub{color:#a8c2b1;font-size:13px}
    h2{text-align:center;margin:10px 0 6px}
    p{text-align:center;color:#a8c2b1;font-size:13px;margin:0 0 18px}
    .grid{display:grid;gap:11px}
    input{
      width:100%;padding:14px;border-radius:16px;border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.06);color:#fff;outline:none;font:inherit
    }
    input:focus{border-color:rgba(72,240,139,.45);box-shadow:0 0 0 3px rgba(72,240,139,.08)}
    button{
      border:0;border-radius:16px;padding:14px;font:inherit;font-weight:900;cursor:pointer;
      background:linear-gradient(135deg,#48f08b,#18c96b);color:#07110b
    }
    button:disabled{opacity:.5}
    .link{text-align:center;margin-top:14px;color:#48f08b;font-weight:800;text-decoration:none;display:block}
    .msg{margin-top:12px;text-align:center;font-size:13px;min-height:22px;color:#ff9b9b}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo">🐣</div>
      <div><h1>VERO FARM</h1><div class="sub">Dark Cartoon Farm</div></div>
    </div>

    <h2>چوونەژوورەوە</h2>
    <p>بە ئیمەیڵ و وشەی نهێنی بچۆ ژوورەوە</p>

    <div class="grid">
      <input id="email" type="email" placeholder="ئیمەیڵ">
      <input id="password" type="password" placeholder="وشەی نهێنی">
      <button id="loginBtn" onclick="login()">چوونەژوورەوە</button>
    </div>

    <div id="msg" class="msg"></div>
    <a class="link" href="register.html">هەژمارت نییە؟ تۆماربە</a>
  </div>

<script>
const SUPABASE_URL="https://vhxafelyesuhpivopcni.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_fMc3VhlhSEnyoCAf0DcJWQ_zTsl5tRv";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const msg=document.getElementById("msg");
  const btn=document.getElementById("loginBtn");

  msg.textContent="";
  if(!email||!password){msg.textContent="ئیمەیڵ و وشەی نهێنی بنووسە.";return;}

  btn.disabled=true;
  const {data,error}=await db.auth.signInWithPassword({email,password});
  btn.disabled=false;

  if(error){msg.textContent=error.message;return;}

  const {data:profile}=await db.from("profiles").select("is_admin").eq("id",data.user.id).single();
  location.href=profile?.is_admin ? "admin.html" : "Vero.html";
}

(async()=>{
  const {data}=await db.auth.getSession();
  if(data.session){
    const {data:profile}=await db.from("profiles").select("is_admin").eq("id",data.session.user.id).single();
    location.href=profile?.is_admin ? "admin.html" : "Vero.html";
  }
})();
</script>
</body>
</html>
